name: Verify PitchKit fork

on:
  push:
    branches:
      - feat/source-agnostic-analyzer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :PitchKit:testDebugUnitTest --stacktrace

      - name: Assemble library
        run: ./gradlew :PitchKit:assembleDebug --stacktrace
